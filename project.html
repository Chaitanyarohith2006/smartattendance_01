<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Attendance System</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: linear-gradient(135deg, #eef2ff, #f8fafc);
  color: #333;
}

#loginPage {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.login-box {
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  width: 300px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.login-box h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #2563eb;
}

.input-group {
  margin-bottom: 15px;
}

.input-group input {
  width: 100%;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 10px;
  background: #2563eb;
  border: none;
  border-radius: 6px;
  color: white;
  cursor: pointer;
}

#dashboard {
  display: none;
}

.sidebar {
  width: 220px;
  height: 100vh;
  background: #1e3a8a;
  color: white;
  position: fixed;
  padding: 20px;
}

.sidebar button {
  background: none;
  color: white;
  border: none;
  padding: 10px;
  width: 100%;
  text-align: left;
}

.main {
  margin-left: 240px;
  padding: 20px;
}

table {
  width: 100%;
  margin-top: 20px;
  border-collapse: collapse;
  background: white;
}

th {
  background: #2563eb;
  color: white;
  padding: 10px;
}

td {
  padding: 10px;
  border-bottom: 1px solid #ddd;
}
</style>
</head>

<body>

<div id="loginPage">
  <div class="login-box">
    <h2>Smart Attendance</h2>
    <div class="input-group">
      <input type="email" id="email" placeholder="Email">
    </div>
    <div class="input-group">
      <input type="password" id="password" placeholder="Password">
    </div>
    <button onclick="login()">Login</button>
    <p id="error" style="color:red;"></p>
  </div>
</div>

<div id="dashboard">
  <div class="sidebar">
    <h3>Menu</h3>
    <button onclick="showSection('students')">Students</button>
    <button onclick="showSection('attendance')">Attendance</button>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="main">
    <div id="studentsSection">
      <h2>Students</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Roll</th>
            <th>Branch</th>
            <th>Section</th>
            <th>CGPA</th>
          </tr>
        </thead>
        <tbody id="studentTable"></tbody>
      </table>
    </div>

    <div id="attendanceSection" style="display:none;">
      <h2>Attendance</h2>
      <button onclick="markAll()">Mark All Present</button>

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Roll</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="attendanceTable"></tbody>
      </table>

      <br>
      <button onclick="saveAttendance()">Save Attendance</button>
    </div>
  </div>
</div>

<script>
let students = [
  {name:"John", roll:"101", branch:"CSE", section:"A", cgpa:8.5},
  {name:"Alice", roll:"102", branch:"ECE", section:"B", cgpa:9.1},
  {name:"David", roll:"103", branch:"IT", section:"A", cgpa:7.8}
];

function login() {
  let email = document.getElementById("email").value;
  let pass = document.getElementById("password").value;

  if(email === "admin@gmail.com" && pass === "1234") {
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    loadStudents();
    loadAttendance();
  } else {
    document.getElementById("error").innerText = "Invalid credentials";
  }
}

function logout() {
  location.reload();
}

function showSection(section) {
  document.getElementById("studentsSection").style.display = "none";
  document.getElementById("attendanceSection").style.display = "none";
